    flows: [authorizationCode, clientCredentials]
    api: metro-bank:metro-bank-account-information-api
    sources: [OBIE Read/Write API Security Profile]
  - scope: payments
    description: >-
      Payment Initiation (PIS) - create and submit domestic, scheduled,
