- aid: metro-bank:metro-bank-confirmation-of-funds-api
  name: Metro Bank Confirmation of Funds API
  description: >-
    OBIE Read/Write Confirmation of Funds (CBPII) API allowing a card-based payment instrument issuer
    to confirm whether sufficient funds are available on a customer account. FAPI-secured with OAuth2/OIDC,
