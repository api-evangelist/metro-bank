- aid: metro-bank:metro-bank-payment-initiation-api
  name: Metro Bank Payment Initiation API
  description: >-
    OBIE Read/Write Payment Initiation Service (PIS) API for initiating domestic and scheduled payments,
    standing orders, and file payments on behalf of a consenting customer. FAPI-secured with OAuth2/OIDC,
    mutual TLS, and PSD2 strong customer authentication; requires developer-portal onboarding and eIDAS/OBIE
    certificates.
  humanURL: https://developer.metrobankonline.co.uk/Overview
  baseURL: https://api.metrobankonline.co.uk/open-banking/v3.1/pisp
