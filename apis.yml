name: Metro Bank
kind: company
description: Metro Bank is a UK retail and commercial bank founded in 2010 as the first
  new high-street bank to open in Britain in over 150 years, headquartered in London
  and listed on the London Stock Exchange (ticker MTRO). It is a public limited company
  (not a mutual or building society), authorised by the Prudential Regulation Authority
  and regulated by the Financial Conduct Authority and the PRA, serving personal and
  business customers through its branch ("store") network and digital channels. As
  an FCA-authorised account servicing payment service provider (ASPSP) under PSD2,
  Metro Bank participates in UK Open Banking without being one of the nine CMA-mandated
  banks (the CMA9). It operates a public developer portal, built on Google Apigee, that
  publishes PSD2 / UK Open Banking APIs aligned to the Open Banking Implementation
  Entity (OBIE) Read/Write standard - Account and Transaction Information, Payment
  Initiation, and Confirmation of Funds - secured with FAPI-grade OAuth2/OIDC, mutual
  TLS, dynamic client registration, and PSD2 strong customer authentication, alongside
  the OBIE Open Data reference-data APIs and FCA service-quality metrics reporting.
