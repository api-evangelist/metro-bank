apis:
- aid: metro-bank:metro-bank-account-information-api
  name: Metro Bank Account and Transaction Information API
  description: >-
    OBIE Read/Write Account Information Service (AIS) API providing consented access to account details,
    balances, transactions, beneficiaries, standing orders, direct debits, and statements. FAPI-secured
    with OAuth2/OIDC, mutual TLS, and PSD2 strong customer authentication; requires developer-portal onboarding
    and eIDAS/OBIE certificates.
  humanURL: https://developer.metrobankonline.co.uk/Overview
  baseURL: https://api.metrobankonline.co.uk/open-banking/v3.1/aisp
  tags:
